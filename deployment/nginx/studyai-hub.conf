# ==============================================================================
# Nginx Configuration for StudyAI Hub (https://studyaihub.tech)
# Production Ready - HTTP/2, Gzip/Brotli, FastCGI Caching & High Security Headers
# ==============================================================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name studyaihub.tech www.studyaihub.tech;
    return 301 https://studyaihub.tech$request_uri;
}

# Redirect www to non-www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.studyaihub.tech;

    ssl_certificate /etc/letsencrypt/live/studyaihub.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studyaihub.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://studyaihub.tech$request_uri;
}

# Main Application Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studyaihub.tech;

    root /var/www/studyaihub/website;
    index index.html index.php;

    # SSL TLS Certificates & Ciphers
    ssl_certificate /etc/letsencrypt/live/studyaihub.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studyaihub.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers (A+ Rating)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # Gzip Compression for Core Web Vitals
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static Assets Long-term Caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2)$ {
        expires 365d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Clean URL Routing
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    # XML Sitemap and robots.txt explicitly allowed
    location = /sitemap.xml {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Deny access to hidden/git files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
