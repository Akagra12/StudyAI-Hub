version: '3.8'

services:
  web:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: studyai_web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
    volumes:
      - ../../website:/var/www/studyaihub/website
    networks:
      - studyai_network

networks:
  studyai_network:
    driver: bridge
